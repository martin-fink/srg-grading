name: grading-prototype
x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  database:
    <<: *runtime
    image: grading-postgres:prototype
    user: "10002:10002"
    cpus: 2
    mem_limit: 1g
    networks: [database]
    volumes:
      - ${GRADING_STATE:?set GRADING_STATE}/postgres:/var/lib/postgresql/data
      - ${GRADING_SECRETS:?set GRADING_SECRETS}/database/postgres-password:/run/secrets/postgres-password:ro
      - ${GRADING_SECRETS}/database/grading_owner-password:/run/secrets/grading_owner-password:ro
      - ${GRADING_SECRETS}/database/grading_web-password:/run/secrets/grading_web-password:ro
      - ${GRADING_SECRETS}/database/grading_operator-password:/run/secrets/grading_operator-password:ro
      - ${GRADING_SECRETS}/database/grading_admin-password:/run/secrets/grading_admin-password:ro
    tmpfs:
      - /run/postgresql:uid=10002,gid=10002,mode=0700,size=16m
      - /tmp:uid=10002,gid=10002,mode=0700,size=32m
    healthcheck:
      test: [CMD, pg_isready, -h, /run/postgresql, -U, postgres]
      interval: 10s
      timeout: 5s
      retries: 6
  web:
    <<: *runtime
    image: grading-web:prototype
    user: "10001:10001"
    cpus: 2
    mem_limit: 1g
    networks: [database, egress]
    depends_on: {database: {condition: service_healthy}}
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8081:8081"]
    command: [--listen, "0.0.0.0:8080", --internal-listen, "0.0.0.0:8081", --public-url, "${GRADING_PUBLIC_URL:?set GRADING_PUBLIC_URL}", --database-url-file, /run/secrets/database-url, --github-config, /run/secrets/github.json, --webhook-secret-file, /run/secrets/webhook, --artifact-dir, /var/lib/grading/artifacts]
    volumes:
      - ${GRADING_STATE}/artifacts:/var/lib/grading/artifacts
      - ${GRADING_SECRETS}/app/database-url:/run/secrets/database-url:ro
      - ${GRADING_SECRETS}/app/github.json:/run/secrets/github.json:ro
      - ${GRADING_SECRETS}/app/github.pem:/run/secrets/github.pem:ro
      - ${GRADING_SECRETS}/app/webhook:/run/secrets/webhook:ro
    tmpfs: [/tmp:uid=10001,gid=10001,mode=0700,size=64m]
  tasks:
    <<: *runtime
    image: grading-cli:prototype
    user: "10001:10001"
    cpus: 2
    mem_limit: 1g
    networks: [database, egress]
    depends_on: {database: {condition: service_healthy}}
    command: [--database-url-file, /run/secrets/database-url, --github-config, /run/secrets/github.json, --artifact-dir, /var/lib/grading/artifacts, work]
    volumes:
      - ${GRADING_STATE}/artifacts:/var/lib/grading/artifacts
      - ${GRADING_SECRETS}/app/database-url:/run/secrets/database-url:ro
      - ${GRADING_SECRETS}/app/github.json:/run/secrets/github.json:ro
      - ${GRADING_SECRETS}/app/github.pem:/run/secrets/github.pem:ro
    tmpfs: [/tmp:uid=10001,gid=10001,mode=0700,size=64m]
  migrate:
    <<: *runtime
    profiles: [operations]
    restart: "no"
    image: grading-cli:prototype
    user: "10001:10001"
    cpus: 1
    mem_limit: 512m
    networks: [database]
    command: [--database-url-file, /run/secrets/database-url, migrate]
    volumes:
      - ${GRADING_SECRETS}/owner/database-url:/run/secrets/database-url:ro
    tmpfs: [/tmp:uid=10001,gid=10001,mode=0700,size=32m]
  admin:
    <<: *runtime
    profiles: [operations]
    restart: "no"
    image: grading-cli:prototype
    user: "10001:10001"
    cpus: 1
    mem_limit: 256m
    networks: [database, egress]
    command: [--database-url-file, /run/secrets/database-url, admin, list]
    volumes:
      - ${GRADING_SECRETS}/admin/database-url:/run/secrets/database-url:ro
    tmpfs: [/tmp:uid=10001,gid=10001,mode=0700,size=32m]
  operator:
    <<: *runtime
    profiles: [operations]
    restart: "no"
    image: grading-cli:prototype
    user: "10001:10001"
    cpus: 1
    mem_limit: 1g
    networks: [database, egress]
    environment:
      GRADING_DATABASE_URL_FILE: /run/secrets/database-url
      GRADING_GITHUB_CONFIG: /run/secrets/github.json
      USER: "${GRADING_OPERATOR:-host-root}"
    command: [reconcile]
    volumes:
      - ${GRADING_STATE}/artifacts:/var/lib/grading/artifacts
      - ${GRADING_SECRETS}/operator/database-url:/run/secrets/database-url:ro
      - ${GRADING_SECRETS}/app/github.json:/run/secrets/github.json:ro
      - ${GRADING_SECRETS}/app/github.pem:/run/secrets/github.pem:ro
      - ${GRADING_COURSES:?set GRADING_COURSES}:/courses:ro
    tmpfs: [/tmp:uid=10001,gid=10001,mode=0700,size=64m]
networks:
  database: {internal: true}
  egress: {}
