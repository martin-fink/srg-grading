apiVersion: v1
kind: Namespace
metadata:
  name: grading-sandboxes
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.34
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: deny-all, namespace: grading-sandboxes}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: grading-budget, namespace: grading-sandboxes}
spec:
  hard:
    requests.cpu: "20"
    limits.cpu: "20"
    requests.memory: 64Gi
    limits.memory: 64Gi
    requests.ephemeral-storage: 128Gi
    limits.ephemeral-storage: 128Gi
    pods: "4"
    count/jobs.batch: "20"
---
apiVersion: v1
kind: LimitRange
metadata: {name: sandbox-limits, namespace: grading-sandboxes}
spec:
  limits:
    - type: Container
      max: {cpu: "10", memory: 32Gi, ephemeral-storage: 64Gi}
      min: {cpu: "1", memory: 128Mi, ephemeral-storage: 128Mi}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: grading-executor, namespace: grading-sandboxes}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: grading-executor, namespace: grading-sandboxes}
subjects:
  - kind: User
    name: grading-executor
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: grading-executor
  apiGroup: rbac.authorization.k8s.io
