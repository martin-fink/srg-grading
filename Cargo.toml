[workspace]
members = ["crates/core", "crates/store", "crates/github", "crates/web", "crates/executor", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
grading-core = { path = "crates/core" }
grading-store = { path = "crates/store" }
grading-github = { path = "crates/github" }
anyhow = "1"
askama = "0.16"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
k8s-openapi = { version = "0.28", features = ["v1_34"] }
kube = { version = "4", default-features = false, features = ["client", "rustls-tls", "ring"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
strip = true
